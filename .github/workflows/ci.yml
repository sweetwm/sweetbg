name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  # Rolling archlinux:latest
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PACMAN_DEPS: >-
    base-devel git meson ninja pkgconf clang
    wayland wayland-protocols libpng libjpeg-turbo libwebp scdoc
  PACMAN_LINT_DEPS: >-
    git actionlint shellcheck

jobs:
  lint:
    name: Workflow and Shell Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          # shellcheck disable=SC2086
          pacman -Syu --noconfirm --needed \
            $PACMAN_LINT_DEPS

      - name: Checkout
        uses: actions/checkout@v7

      - run: actionlint

      - name: Check shell scripts
        run: |
          shellcheck \
            scripts/all \
            scripts/check \
            scripts/format \
            scripts/sanitize \
            scripts/tidy \
            scripts/valgrind

  check:
    name: Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Build under both compilers
    strategy:
      fail-fast: false
      matrix:
        compiler: [clang, gcc]
    container:
      image: archlinux:latest
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - name: Install dependencies
        run: |
          # shellcheck disable=SC2086
          pacman -Syu --noconfirm --needed \
            $PACMAN_DEPS

      - name: Checkout
        uses: actions/checkout@v7

      - run: ./scripts/check

  tidy:
    name: Clang-Tidy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          # shellcheck disable=SC2086
          pacman -Syu --noconfirm --needed \
            $PACMAN_DEPS

      - name: Checkout
        uses: actions/checkout@v7

      - run: ./scripts/tidy

  release-check:
    name: Release Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          # shellcheck disable=SC2086
          pacman -Syu --noconfirm --needed \
            $PACMAN_DEPS

      - name: Checkout
        uses: actions/checkout@v7

      - run: meson setup build-release --werror -Dbuildtype=release
      - run: ninja -C build-release
      - run: ./build-release/sweetbg --version
      - run: ./build-release/sweetbgd --version

  nix:
    name: Nix Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      # Catches nix/package.nix
      - run: nix flake check -L
      - run: nix build -L
